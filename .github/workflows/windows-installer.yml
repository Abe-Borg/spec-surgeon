name: Publish Windows installer

on:
  push:
    branches: [master]
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/windows-build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/
      - name: Check the installer matches its published tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          BUILD_REVISION: ${{ needs.build.outputs.revision }}
        run: |
          tag="v$APP_VERSION"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::No release $tag yet; the tag's release workflow publishes this installer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "repair=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          installer="SpecSurgeon-$APP_VERSION-Setup-x64.exe"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$installer"; then
            echo "::notice::The installer for $tag is immutable; verify or repair its release checksums."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "repair=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          tag_revision="$(git rev-parse "refs/tags/$tag^{commit}")"
          if [ "$BUILD_REVISION" != "$tag_revision" ]; then
            echo "::error::The installer was built from a different commit than $tag. Bump the version and publish a new release."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "repair=true" >> "$GITHUB_OUTPUT"
      - name: Verify or repair installer checksums without replacing published assets
        if: steps.release.outputs.repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          ALLOW_INSTALLER_UPLOAD: ${{ steps.release.outputs.publish }}
        run: |
          options=()
          if [ "$ALLOW_INSTALLER_UPLOAD" = "true" ]; then options+=(--allow-installer-upload); fi
          python packaging/windows/publish_installer.py --repository "$GITHUB_REPOSITORY" \
            --tag "v$APP_VERSION" --installer "dist/SpecSurgeon-$APP_VERSION-Setup-x64.exe" "${options[@]}"
