name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # An explicit tag correction supersedes validation of the previous commit.
  cancel-in-progress: ${{ github.event.forced == true }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # 22+: `npm test` runs node --test over the .ts files and relies on Node's type stripping.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check release version and notes
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assignments = ast.parse(pathlib.Path("src/spec_surgeon/__init__.py").read_text()).body
          runtime_version = next(ast.literal_eval(node.value) for node in assignments
                                 if isinstance(node, ast.Assign)
                                 and any(isinstance(target, ast.Name) and target.id == "__version__"
                                         for target in node.targets))
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", (tag, version)
          assert runtime_version == version, (runtime_version, version)
          assert pathlib.Path(f"docs/releases/{tag}.md").is_file(), "Release notes are required"
          PY
      - name: Install test and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer pandoc
          python -m pip install -e ".[dev,agent,gui]" build twine jsonschema
      - name: Build the window's page
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check the committed page is the one the source builds
        # The wheel ships the built page from src/spec_surgeon/web/static, so it is committed. When this step fails,
        # the committed page is not what frontend/ builds: run `npm ci` and `npm run build` in frontend/ (Node 22)
        # and commit everything under src/spec_surgeon/web/static together with the frontend change.
        run: |
          git diff --exit-code --stat -- src/spec_surgeon/web/static
          untracked="$(git ls-files --others --exclude-standard -- src/spec_surgeon/web/static)"
          if [ -n "$untracked" ]; then
            echo "Built files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Test the page's rules
        working-directory: frontend
        run: npm test
      - name: Test with LibreOffice
        run: |
          python -c "import spec_surgeon.web.server; from spec_surgeon.render.libreoffice import find_soffice; assert find_soffice()"
          python -m pytest -q -s --junitxml=release-tests.xml
      - name: Build and validate distributions
        run: |
          python packaging/installed_wheel_smoke.py --print-prompt-fingerprints > /tmp/spec-surgeon-source-prompts.json
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/spec-surgeon-release-smoke
          /tmp/spec-surgeon-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/spec-surgeon-release-smoke/bin/spec-surgeon --help
          /tmp/spec-surgeon-release-smoke/bin/spec-surgeon ops --catalog > /tmp/spec-surgeon-catalog.json
          /tmp/spec-surgeon-release-smoke/bin/python "$GITHUB_WORKSPACE/packaging/installed_wheel_smoke.py" "$GITHUB_WORKSPACE/examples/specs" --expected-prompts /tmp/spec-surgeon-source-prompts.json
          # without the gui extra the window says how to install it instead of crashing
          set +e; /tmp/spec-surgeon-release-smoke/bin/spec-surgeon-gui; code=$?; set -e
          test "$code" = 2
          # with the gui extra but no pywebview (Linux): the wheel's page is served and the window falls back to the
          # browser (BROWSER=true keeps the runner from launching one); the server must come up and the app must close
          # cleanly when told to stop (SIGTERM: a background job in a non-interactive shell starts with SIGINT ignored).
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          /tmp/spec-surgeon-release-smoke/bin/python -m pip install "spec-surgeon[gui] @ file://$wheel"
          BROWSER=true SPEC_SURGEON_NO_UPDATE_CHECK=1 SPEC_SURGEON_CONFIG_DIR=/tmp/spec-surgeon-smoke-config \
            /tmp/spec-surgeon-release-smoke/bin/spec-surgeon-gui 2> /tmp/spec-surgeon-gui.log &
          pid=$!
          for i in $(seq 1 60); do
            grep -q "open in your browser at http://127.0.0.1:" /tmp/spec-surgeon-gui.log && break
            sleep 0.5
          done
          cat /tmp/spec-surgeon-gui.log
          grep -q "open in your browser at http://127.0.0.1:" /tmp/spec-surgeon-gui.log
          kill -TERM "$pid"
          wait "$pid"
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: release-tests.xml
      - name: Save release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/

  windows:
    uses: ./.github/workflows/windows-build.yml

  publish:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/
      - name: Check the source and installer still match the release tag
        env:
          WINDOWS_BUILD_REVISION: ${{ needs.windows.outputs.revision }}
        run: |
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          source_revision="$(git rev-parse HEAD)"
          tag_revision="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$source_revision" = "$tag_revision"
          test "$WINDOWS_BUILD_REVISION" = "$tag_revision"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.whl *.tar.gz *.exe > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$(sed -n '1s/^# //p' "docs/releases/$GITHUB_REF_NAME.md")" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
