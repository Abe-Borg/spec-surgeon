name: Verify pull request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # 22+: `npm test` runs node --test over the .ts files and relies on Node's type stripping.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer pandoc poppler-utils
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,agent,gui,word]" build twine jsonschema
      - name: Build the window's page
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check the committed page is the one the source builds
        # The Python package ships the built page from src/spec_surgeon/web/static, so it is committed. When this
        # step fails, the committed page is not what frontend/ builds: run `npm ci` and `npm run build` in frontend/
        # (Node 22) and commit everything under src/spec_surgeon/web/static together with the frontend change.
        shell: bash
        run: |
          git diff --exit-code --stat -- src/spec_surgeon/web/static
          untracked="$(git ls-files --others --exclude-standard -- src/spec_surgeon/web/static)"
          if [ -n "$untracked" ]; then
            echo "Built files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Test the page's rules
        working-directory: frontend
        run: npm test
      - name: Check the window's server
        run: python -c "import spec_surgeon.web.server, spec_surgeon.web.shell, spec_surgeon.web.updates"
      - name: Check Linux renderer
        if: runner.os == 'Linux'
        run: |
          python -c "from spec_surgeon.render.libreoffice import find_soffice; assert find_soffice()"
          python -m pytest -q tests/test_convert_typed_numbers.py -k libreoffice_shows_every_typed_number_exactly_once_in_order
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
          python packaging/check_wheel_install.py dist
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  windows-installer:
    name: Installed Windows app
    uses: ./.github/workflows/windows-build.yml
