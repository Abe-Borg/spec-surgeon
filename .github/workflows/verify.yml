name: Verify pull request

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      SPEC_SURGEON_REQUIRE_QT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer pandoc poppler-utils libegl1 libopengl0 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,agent,gui,word]" build twine jsonschema
      - name: Check Qt
        run: python -c "from PySide6.QtWidgets import QApplication; QApplication([])"
      - name: Check Linux renderer
        if: runner.os == 'Linux'
        run: |
          python -c "from spec_surgeon.render.libreoffice import find_soffice; assert find_soffice()"
          python -m pytest -q tests/test_convert_typed_numbers.py -k libreoffice_shows_every_typed_number_exactly_once_in_order
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
