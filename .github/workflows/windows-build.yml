name: Build Windows installer

on:
  workflow_call:
    inputs:
      run_tests:
        description: Run the full test suite on Windows before bundling (off when the caller already ran it there)
        type: boolean
        default: true
    outputs:
      version:
        description: Application version bundled in the installer
        value: ${{ jobs.build.outputs.version }}
      revision:
        description: Exact source commit bundled in the installer
        value: ${{ jobs.build.outputs.revision }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          # 22+: `npm test` runs node --test over the .ts files and relies on Node's type stripping.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          "revision=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        # pywebview brings pythonnet on Windows (its WebView2 backend); the WebView2 runtime ships with Windows.
        run: python -m pip install -e ".[gui,word,agent,dev]" "pyinstaller>=6.11,<7" jsonschema
      - name: Build the window's page
        working-directory: frontend
        # --no-audit: npm ci otherwise ends by asking npm's retiring audit endpoint, which has taken up to npm's
        # 5-minute fetch timeout to answer; the build needs no audit.
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check the committed page is the one the source builds
        # The bundle collects src/spec_surgeon/web/static, which is committed. When this step fails, the committed
        # page is not what frontend/ builds: run `npm ci` and `npm run build` in frontend/ (Node 22) and commit
        # everything under src/spec_surgeon/web/static together with the frontend change.
        shell: bash
        run: |
          git diff --exit-code --stat -- src/spec_surgeon/web/static
          untracked="$(git ls-files --others --exclude-standard -- src/spec_surgeon/web/static)"
          if [ -n "$untracked" ]; then
            echo "Built files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Test the page's rules
        working-directory: frontend
        run: npm test
      - name: Run Windows tests
        if: inputs.run_tests
        run: python -m pytest -q -n auto --junitxml=windows-tests.xml
      - name: Bundle the desktop app
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/windows/app.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          Copy-Item examples dist/SpecSurgeon/examples -Recurse
          Copy-Item docs dist/SpecSurgeon/docs -Recurse
          Copy-Item README.md dist/SpecSurgeon/README.md
      - name: Write the license and fetch the PyMuPDF and MuPDF source
        # The app bundles PyMuPDF (AGPL-3.0, no commercial license held), so it is distributed as a whole under the
        # AGPL v3: LICENSE.txt (the installer's license page) names both licenses, and the source of the exact
        # PyMuPDF and MuPDF in the bundle is published beside the installer as its Corresponding Source.
        run: python packaging/windows/license_notices.py --app dist/SpecSurgeon --sources dist/installer
      - name: Build the installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
          }
          & $compiler "/DAppVersion=$env:APP_VERSION" "/O$PWD\dist\installer" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Test install, the window's server and WebView2 backend, batch workers, isolated operations, in-app update, reinstall, and uninstall
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./packaging/windows/validate_installer.ps1 -Installer "$PWD\dist\installer\SpecSurgeon-$env:APP_VERSION-Setup-x64.exe"
      - name: Save Windows validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-validation
          path: |
            windows-tests.xml
            ${{ runner.temp }}/Spec Surgeon installer validation/smoke-result.json
            ${{ runner.temp }}/Spec Surgeon installer validation/install.log
            ${{ runner.temp }}/Spec Surgeon installer validation/update-result.json
            ${{ runner.temp }}/Spec Surgeon installer validation/update-install.log
      - name: Save Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/installer/*.exe
            dist/installer/*.tar.gz
          if-no-files-found: error
