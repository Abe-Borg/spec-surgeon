[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-surgeon"
version = "0.8.0"
description = "Fast, provably lossless surgical edits to Word (.docx) specifications — a few files or dozens — with a mandatory verification record per file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abraham Borg", email = "abrahamborg@gmail.com" }]
dependencies = [
    "lxml>=5.0",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://github.com/Abe-Borg/spec-surgeon"
Repository = "https://github.com/Abe-Borg/spec-surgeon"
Releases = "https://github.com/Abe-Borg/spec-surgeon/releases"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
word = ["pywin32>=306; sys_platform == 'win32'"]
agent = ["anthropic>=1.13"]
dev = ["pytest>=8", "python-docx>=1.1"]

[project.scripts]
spec-surgeon = "spec_surgeon.cli:main"

[project.gui-scripts]
spec-surgeon-gui = "spec_surgeon.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec_surgeon = ["schemas/**/*.xsd", "skill/**/*.md", "ui/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
