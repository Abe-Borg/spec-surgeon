[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-surgeon"
version = "0.3.0"
description = "Fast, provably lossless surgical edits to Word (.docx) specifications — a few files or dozens — with a mandatory verification record per file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Abraham Borg" }]
dependencies = [
    "lxml>=5.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
word = ["pywin32>=306; sys_platform == 'win32'"]
agent = ["anthropic>=1.13"]
dev = ["pytest>=8", "python-docx>=1.1"]

[project.scripts]
spec-surgeon = "spec_surgeon.cli:main"

[project.gui-scripts]
spec-surgeon-gui = "spec_surgeon.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec_surgeon = ["schemas/**/*.xsd", "skill/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
