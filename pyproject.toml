[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-surgeon"
version = "1.13.0"
description = "Surgical edits to Word (.docx) specifications with independent verification records."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abraham Borg", email = "abrahamborg@gmail.com" }]
# PyMuPDF 2.0 requires onnxruntime, numpy and networkx and loads a layout-analysis model whenever pymupdf is imported:
# 75 MB more memory, 13 more threads and about 160 MB more installer for a feature Spec Surgeon never calls.
# regex: every pattern a request or the model writes is searched with a deadline (ops/patterns.py, verify/patterns.py).
dependencies = [
    "lxml>=5.0",
    "pymupdf>=1.24,<2",
    "regex>=2024.4",
]

[project.urls]
Homepage = "https://github.com/Abe-Borg/spec-surgeon"
Repository = "https://github.com/Abe-Borg/spec-surgeon"
Releases = "https://github.com/Abe-Borg/spec-surgeon/releases"

[project.optional-dependencies]
# The window: a local server (FastAPI, uvicorn; python-multipart for uploads) and the page in a native WebView2
# window through pywebview (it brings its own Windows backend, pythonnet; the WebView2 runtime ships with Windows
# 10/11). Node is needed only to rebuild the page (frontend/) — the built page is committed under web/static.
gui = ["fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.9", "pywebview>=5.3"]
word = ["pywin32>=306; sys_platform == 'win32'"]
agent = ["anthropic>=1.13"]
# pytest-xdist: CI and `pytest -n auto` spread the suite over every core (each worker its own process).
dev = ["pytest>=8", "pytest-xdist>=3.5", "python-docx>=1.1"]

[project.gui-scripts]
spec-surgeon-gui = "spec_surgeon.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spec_surgeon = ["schemas/**/*.xsd", "skill/**/*.md", "legal/*.txt", "web/static/**/*", "examples/specs/*.json",
                "examples/tutorial/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
